<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة ولي الأمر | مدرسة أُسيد بن حضير</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            --bg: #eef2ff; --white: #ffffff; --primary: #4f46e5; --secondary: #8b5cf6;
            --dark: #1e293b; --text-muted: #64748b; --border: rgba(255,255,255,0.4);
            --shadow1: 8px 8px 18px rgba(174,174,192,0.35); --shadow2: -8px -8px 18px rgba(255,255,255,0.95);
            --exc-bg: #dcfce7; --exc-txt: #15803d; --we-bg: #fee2e2; --we-txt: #dc2626;
        }

        body { font-family: 'Cairo', sans-serif; background: linear-gradient(135deg,#eef2ff,#dbeafe,#ede9fe); margin: 0; min-height: 100vh; padding: 10px; box-sizing: border-box; color: var(--dark); }

        /* Login Box */
        .login-box { background: rgba(255,255,255,0.2); backdrop-filter: blur(20px); padding: 40px; border-radius: 35px; border: 1px solid var(--border); box-shadow: 0 25px 50px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; margin: 10vh auto; }
        .inp { width: 100%; padding: 14px; border-radius: 15px; border: none; font-family: 'Cairo'; font-weight: 700; outline: none; background: rgba(255,255,255,0.8); box-shadow: inset 2px 2px 5px rgba(0,0,0,0.05); margin-bottom: 15px; }
        .btn-action { width: 100%; padding: 15px; border-radius: 15px; border: none; background: linear-gradient(135deg,var(--primary),var(--secondary)); color: white; font-weight: 800; cursor: pointer; font-size: 16px; transition: 0.3s; }

        /* Dashboard */
        #reportDashboard { display: none; max-width: 900px; margin: auto; }
        
        .navbar { background: rgba(255,255,255,0.55); backdrop-filter: blur(15px); padding: 20px; border-radius: 25px; border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; box-shadow: var(--shadow1); }

        /* Stats Grid */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .stat-card { background: rgba(255,255,255,0.6); padding: 15px; border-radius: 20px; text-align: center; border: 1px solid var(--border); box-shadow: var(--shadow1); cursor: pointer; transition: 0.3s; }
        .stat-card:hover { transform: translateY(-5px); background: #fff; }
        .stat-card h4 { margin: 0; font-size: 11px; color: var(--text-muted); }
        .stat-card p { margin: 5px 0 0; font-size: 22px; font-weight: 900; color: var(--primary); }

        /* Report Item */
        .report-item { background: rgba(255,255,255,0.7); border-radius: 20px; padding: 20px; margin-bottom: 15px; border: 1px solid var(--border); box-shadow: var(--shadow1); position: relative; overflow: hidden; }
        .report-item::before { content: ""; position: absolute; right: 0; top: 0; bottom: 0; width: 6px; background: var(--primary); }
        .report-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
        .badge { padding: 5px 12px; border-radius: 10px; font-size: 11px; font-weight: 800; }
        
        /* زر تحميل ورقة العمل المميز */
        .download-btn { display: inline-flex; align-items: center; gap: 8px; background: linear-gradient(135deg, #2563eb, #3b82f6); color: white; text-decoration: none; padding: 10px 16px; border-radius: 12px; font-size: 12px; font-weight: 700; margin-top: 10px; transition: 0.2s; box-shadow: 0 4px 10px rgba(37,99,235,0.2); }
        .download-btn:active { transform: scale(0.97); }

        /* مؤشر حالة التواجد والاطلاع لولي الأمر */
        .seen-status-container { background: #dcfce7; color: #166534; padding: 8px 15px; border-radius: 12px; font-size: 11px; font-weight: 700; display: inline-block; margin-top: 5px; border: 1px solid #bbf7d0; }

        /* Popup Styles */
        #popup { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 20px; }
        .popup-box { background: white; padding: 30px; border-radius: 30px; width: 100%; max-width: 450px; max-height: 80vh; overflow-y: auto; }

        .lvl-exc { background: var(--exc-bg); color: var(--exc-txt); }
        .warning-badge { background: #fee2e2; color: #dc2626; padding: 2px 8px; border-radius: 6px; font-size: 10px; margin-right: 5px; }
        .award-text { color: #d97706; font-weight: 800; font-size: 13px; }
    </style>
</head>
<body>

<div id="loginArea" class="login-box">
    <div style="background: var(--primary); color: white; width: 50px; height: 50px; border-radius: 15px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 24px; margin: 0 auto 20px;">أ</div>
    <h2>بوابة ولي الأمر</h2>
    <input type="text" id="userInput" class="inp" placeholder="اسم المستخدم">
    <input type="password" id="passInput" class="inp" placeholder="كلمة السر">
    <button class="btn-action" onclick="login()">دخول للاطلاع 🔓</button>
    <p id="errorMsg" style="color:red; font-size:12px; margin-top:15px; display:none; font-weight:bold;">بيانات الدخول غير صحيحة!</p>
</div>

<div id="reportDashboard">
    <nav class="navbar">
        <div>
            <h3 id="stdName" style="margin:0; font-size:18px;">اسم الطالب</h3>
            <small id="stdClass" style="color:var(--text-muted); display:block;">الفصل: --</small>
            <div id="seenBadgeLocation"></div>
        </div>
        <button class="btn-action" style="width:auto; padding:8px 20px; font-size:12px; background:var(--dark)" onclick="location.reload()">خروج</button>
    </nav>

    <div class="stats-grid">
        <div class="stat-card" onclick="showDetails('exc')"><h4>التميز ✨</h4><p id="stat-exc">0</p></div>
        <div class="stat-card" onclick="showDetails('gold')"><h4>ذهب 🥇</h4><p id="stat-gold">0</p></div>
        <div class="stat-card" onclick="showDetails('silver')"><h4>فضة 🥈</h4><p id="stat-silver">0</p></div>
        <div class="stat-card" onclick="showDetails('bronze')"><h4>برونز 🥉</h4><p id="stat-bronze">0</p></div>
        <div class="stat-card" onclick="showDetails('warning')"><h4>انذارات ⚠️</h4><p id="stat-warn">0</p></div>
    </div>

    <div id="reportsList"></div>
</div>

<div id="popup">
    <div class="popup-box">
        <h3 id="popupTitle">التفاصيل</h3>
        <div id="popupContent"></div>
        <button class="btn-action" style="margin-top:20px" onclick="closePopup()">إغلاق</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCIW17B6y6sG_bdUFqF7FWoVIY9ynXv1B4",
        authDomain: "myschoolproject-4ad92.firebaseapp.com",
        databaseURL: "https://myschoolproject-4ad92-default-rtdb.firebaseio.com",
        projectId: "myschoolproject-4ad92",
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    const levelNames = { 'exc': 'متميز ✨', 'cre': 'مبدع 🎨', 'vg': 'جيد جداً 👍', 'fa': 'مقبول 🆗', 'we': 'ضعيف ⚠️' };
    const warnNames = { 'yellow': 'انذار أول 🟨', 'red': 'انذار أخير 🟥', 'warning': 'خصم درجة 📌' };
    const awardNames = { 'gold': 'الميدالية الذهبية 🥇', 'silver': 'الميدالية الفضية 🥈', 'bronze': 'الميدالية البرونزية 🥉' };

    let allEvals = [];

    function login() {
        const u = document.getElementById('userInput').value.trim();
        const p = document.getElementById('passInput').value.trim();
        database.ref('students').once('value', snap => {
            let found = null, sK = "", cl = "";
            const data = snap.val();
            for(let c in data) {
                for(let k in data[c]) {
                    if(data[c][k].user === u && data[c][k].pass.toString() === p) {
                        found = data[c][k]; sK = k; cl = c; break;
                    }
                }
            }
            if(found) {
                registerParentView(cl, sK); // رصد وتثبيت الاطلاع فور تسجيل الدخول بنجاح
                loadData(found, sK, cl);
            }
            else document.getElementById('errorMsg').style.display='block';
        });
    }

    // دالة تحديث حالة ومؤشر الاطلاع في الفايربيس لمتابعة من لم يطلع
    function registerParentView(cls, sKey) {
        const now = new Date();
        const formattedTime = now.toLocaleDateString('ar-SA') + ' - ' + now.toLocaleTimeString('ar-SA');
        
        // حفظ آخر موعد تم الاطلاع فيه في سجل الطالب مباشرة ليتسنى للمعلمين رؤيتها
        database.ref('students/' + cls + '/' + sKey + '/lastSeen').set(formattedTime);
    }

    function loadData(student, sKey, cls) {
        document.getElementById('loginArea').style.display='none';
        document.getElementById('reportDashboard').style.display='block';
        document.getElementById('stdName').innerText = student.name;
        document.getElementById('stdClass').innerText = "الفصل: " + cls;
        
        // عرض تأكيد مرئي لولي الأمر داخل حسابه بأنه تم رصد تواجده واطلاعه بنجاح
        document.getElementById('seenBadgeLocation').innerHTML = `<div class="seen-status-container">✓ تم تأكيد اطلاعك على التقارير للإدارة</div>`;

        database.ref('evaluations/'+cls+'/'+sKey).on('value', snap => {
            const data = snap.val();
            const list = document.getElementById('reportsList');
            list.innerHTML = "";
            if(!data) { list.innerHTML = "<div style='text-align:center; padding:50px'>لا توجد بيانات</div>"; return; }
            
            allEvals = Object.values(data).reverse();
            let stats = { exc:0, gold:0, silver:0, bronze:0, warn:0 };

            allEvals.forEach(ev => {
                if(ev.level === 'exc') stats.exc++;
                if(ev.award === 'gold') stats.gold++;
                if(ev.award === 'silver') stats.silver++;
                if(ev.award === 'bronze') stats.bronze++;
                if(ev.warning) stats.warn++;

                // فحص ما إذا كان هناك ملف ورقة عمل مرفق مع التقرير
                let fileBtnHtml = "";
                if (ev.worksheet) {
                    fileBtnHtml = `
                        <div style="margin-top:10px;">
                            <a href="${ev.worksheet}" download="ورقة_عمل_${ev.subject || 'درس'}.png" class="download-btn">
                                📥 تحميل ورقة العمل المرفقة
                            </a>
                        </div>
                    `;
                }

                list.innerHTML += `
                    <div class="report-item">
                        <div class="report-header">
                            <div>
                                <small style="color:var(--text-muted)">${ev.date} | ${ev.time || ''}</small>
                                <div style="font-weight:900; font-size:16px; margin-top:5px;">مادة: ${ev.subject}</div>
                            </div>
                            <span class="badge lvl-${ev.level}">${levelNames[ev.level] || 'تم الرصد'}</span>
                        </div>
                        <div style="margin: 10px 0;">
                            ${ev.award ? `<span class="award-text">🏆 ${awardNames[ev.award]}</span>` : ''}
                            ${ev.warning ? `<span class="warning-badge">${warnNames[ev.warning]}</span>` : ''}
                        </div>
                        <div style="font-size:13px; margin-bottom:10px">
                            <span>الواجب:</span> <strong style="color:var(--primary)">${ev.homework || 'لا يوجد'}</strong>
                        </div>
                        <div style="background:#fff; padding:10px; border-radius:12px; font-size:13px; border:1px solid #eee">
                            💬 ${ev.message || 'لا توجد ملاحظات إضافية'}
                        </div>
                        ${fileBtnHtml}
                    </div>
                `;
            });

            document.getElementById('stat-exc').innerText = stats.exc;
            document.getElementById('stat-gold').innerText = stats.gold;
            document.getElementById('stat-silver').innerText = stats.silver;
            document.getElementById('stat-bronze').innerText = stats.bronze;
            document.getElementById('stat-warn').innerText = stats.warn;
        });
    }

    function showDetails(type) {
        let content = "";
        allEvals.forEach(ev => {
            let match = false;
            if(type === 'exc' && ev.level === 'exc') match = true;
            if(type === ev.award) match = true;
            if(type === 'warning' && ev.warning) match = true;

            if(match) {
                content += `<div style="padding:10px; border-bottom:1px solid #eee">
                    <strong>${ev.subject}</strong> <small>(${ev.date})</small>
                    <div style="font-size:11px; color:var(--text-muted)">${ev.message || ''}</div>
                </div>`;
            }
        });

        document.getElementById('popupTitle').innerText = "تفاصيل السجل";
        document.getElementById('popupContent').innerHTML = content || "لا توجد سجلات لهذه الفئة";
        document.getElementById('popup').style.display = 'flex';
    }

    function closePopup() { document.getElementById('popup').style.display = 'none'; }
</script>
</body>
</html>
